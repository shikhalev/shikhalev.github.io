<svg xmlns="http://w3.org" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Стили для градиентов и эффектов -->
  <defs>
    <!-- Градиент для синей Вавилонской башни -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#2170CB" />
      <stop offset="100%" stop-color="#0A3D7A" />
    </linearGradient>
    
    <!-- Градиент для центрального оранжевого кристалла -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    
    <!-- Тень для объема -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Задний план (Опционально, можно удалить для прозрачности) -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Основная группа иконки -->
  <g filter="url(#shadow)">
    <!-- Ступени Башни (Снизу вверх) -->
    <!-- Основание (1 ярус) -->
    <path d="M 20,160 Q 100,185 180,160 L 175,135 Q 100,160 25,135 Z" fill="url(#towerGrad)" />
    
    <!-- 2 ярус -->
    <path d="M 32,130 Q 100,152 168,130 L 162,105 Q 100,127 38,105 Z" fill="url(#towerGrad)" />
    
    <!-- 3 ярус -->
    <path d="M 45,100 Q 100,120 155,100 L 148,75 Q 100,95 52,75 Z" fill="url(#towerGrad)" />
    
    <!-- 4 ярус -->
    <path d="M 60,70 Q 100,88 140,70 L 133,45 Q 100,63 67,45 Z" fill="url(#towerGrad)" />
    
    <!-- Вершина (5 ярус) -->
    <path d="M 75,40 Q 100,55 125,40 L 118,15 Q 100,30 82,15 Z" fill="url(#towerGrad)" />

    <!-- Оранжевый Кристалл (Стрелка) по центру -->
    <!-- Левая грань кристалла -->
    <path d="M 100,65 L 68,125 Q 100,135 100,135 Z" fill="url(#crystalGrad)" opacity="0.9" />
    
    <!-- Правая грань кристалла (чуть темнее для объема) -->
    <path d="M 100,65 L 132,125 Q 100,135 100,135 Z" fill="#E65100" />
    
    <!-- Блик/Фронтальное ребро -->
    <line x1="100" y1="65" x2="100" y2="135" stroke="#FFF" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
