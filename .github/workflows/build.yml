name: Build & Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Setup ImageMagick 7
        uses: mfinelli/setup-imagemagick@v8
        with:
          install-libfuse2: true
      - name: Images from Cache
        uses: actions/cache/restore@v4
        with:
          path: .is-images-cache
          key: ${{ runner.os }}-jekyll-images-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jekyll-images-
      - name: Build
        run: |
          echo "Build..."
          JEKYLL_ENV=production NODE_ENV=production bundle exec jekyll build
      - name: Images to Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .is-images-cache
          key: ${{ runner.os }}-jekyll-images-${{ github.run_id }}
      - name: Back push
        uses: jekyll-is/action-jekyll-is-backpush@v1
        with:
          label: 'Jekyll Build'
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-user-id: ${{ secrets.MY_TG_ID }}
      - name: Publish
        uses: jekyll-is/action-jekyll-is-publish@main
        with:
          label: 'Jekyll Build'
          sync-dir: '_site'
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-repository: ${{ github.repository }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-user-id: ${{ secrets.MY_TG_ID }}
