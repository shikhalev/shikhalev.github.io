# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

lang: ru
title: Иван Шихалев
email: shikhalev@gmail.com
author: Иван Шихалев
description: Блог. Склад текстов. И прочее городу и миру...
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shikhalev.github.io" # the base hostname & protocol for your site, e.g. http://example.com
show_excerpts: true
rss: rss
future: true

excerpt_separator: <!--more-->

permalink: /:year/:month/:title:output_ext

markdown: kramdown
kramdown:
  parse_block_html: true
  auto_ids: true
  input: ISKram

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-redirect-from
  - jekyll-is-images
  - jekyll-is-announcer

theme: jekyll-theme-shikhalev

shi_images:
  image_bounds: fhd

toc:
  min_level: 2
  max_level: 4
  list_id: toc_list

google:
  ads:
    client: ca-pub-0375312458116348
    slot: 3344942310
  analytics: G-QCHKX2MX1B
  search: 757997bbb3ada06b9

yandex:
  metrika: 72960469

microsoft:
  clarity: u2gczedmo7

license:
  content:
    name: CC BY-SA 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      toc: true
      author: Иван Шихалев
      comments: false
      icon: file-alt
  - scope:
      path: "_posts/about"
    values:
      permalink: /about/:year/:month/:title:output_ext
  - scope:
      path: "_posts/blog"
    values:
      permalink: /life/:year/:month/:title:output_ext
      is_images:
        seo_image:
          site: "Иван Шихалев / Блог"
  - scope:
      path: "_posts/photo"
    values:
      permalink: /photo/:year/:month/:title:output_ext
      is_images:
        seo_image:
          site: "Иван Шихалев / О фото"
  - scope:
      path: "_posts/tech"
    values:
      permalink: /tech/:year/:month/:title:output_ext
      is_images:
        seo_image:
          site: "Иван Шихалев / Технологии"
  - scope:
      path: "_posts/text"
    values:
      permalink: /text/:year/:month/:title:output_ext
      is_images:
        seo_image:
          site: "Иван Шихалев / Тексты"
  - scope:
      path: "_drafts"
    values:
      layout: post
  - scope:
      path: "_calendars"
    values:
      layout: nova/calendar
      type: website
      author: Иван Шихалев
  - scope:
      path: "_streams"
    values:
      layout: stream
      type: website
      author: Иван Шихалев
  - scope:
      path: "*"
    values:
      layout: nova/page
      image: _src/IMG_2774.jpg
      hide_last_comments: true
      toc: true
  - scope:
      path: "_matters"
    values:
      layout: book/page
  - scope:
      path: "_matters/lib/darktable"
    values:
      image: _src/2025/10/darktable.png
  - scope:
      path: "_designs"
      type: "designs"
    values:
      layout: merch/design
  - scope:
      path: "_goods"
      type: "goods"
    values:
      layout: merch/kind

header_pages:
  - _streams/tech.md
  - _streams/photo.md
  - _streams/life.md
  - _streams/text.md
  - _designs/merch.md
  - _streams/about.md

feed:
  categories:
    - tech
    - pub
    - photo
    - life
    - text
    - best
  excerpt_only: false

collections:
  streams:
    output: true
    permalink: /:path/
  calendars:
    output: true
    permalink: /:path/all
  designs:
    output: true
    permalink: /:path/
  goods:
    output: true
    permalink: /merch/:path/
  matters:
    output: true
    permalink: /:path/
  src:
    output: false

staticman_url: https://api.staticman.net/v3/entry/github/shikhalev/shikhalev.github.io/main/comments
date_format: "%Y.%m.%d"

exclude:
  - .vscode/
  - .announces.json
  - .is-images-cache
  - _plugins
  - tmp/
  - flatten.log

# Собственные настройки сайта

comments_json_limit: 20
comments_side_limit: 3
category_page_limit: 10
category_page_maximum: 12
home_page_limit: 12
home_page_maximum: 15

watermark: "shikhalev.*"

announcer:
  url: "https://shikhalev.github.io"
  categories:
    tech: технологии
    programming: программирование
    life: жизнь
    social: общество
    psi: психология
    mind: мышление
    about: сайт
    photo: фото
    pub: публикации
    text: тексты
    dybr: дыбр
    nature: природа
    politics: политика
    birdwatching: бёрдвотчинг
    processing: обработка
    penguin: false
    samag: false
    db: БД
    hard: железо
    soft: ПО
    web: веб
    abs: абстракции
    fpc: FPC
    graphics: графика
    best: избранное
    prose: проза
    verses: стихи
    tales: сказочки
  telegram:
    method: telegram
    chat_id: "@shikhalev_blog"

is_images:
  view:
    width: 1800
    height: 1200
  seo_image:
    salt: 0
    font:
      caption: _src/fonts/PTC55F.ttf
      date: _src/fonts/PTC55F.ttf
    date_format: '%Y / %m / %d'
    overlay:
      background: '#66666699'
      foreground: '#EEEEEEEE'
